<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusDirect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/src/output.css">
    <script type="module" src="js/main-trajets.js"></script>
</head>
<body class="bg-cyan-100 text-black">
    <header class="flex justify-between items-center gap-2 bg-white px-3 py-2 shadow-lg">
        <article class="flex items-center gap-2">
            <img class="w-10 h-10 bg-gray-300 rounded-full" src="./img/Logo.jpg" alt="Logo">
            <h1 class="sm:block text-xl font-bold">Bus Direct</h1>
        </article>
        <article>
            <img class="img-logo w-10 h-10 bg-indigo-700 rounded-full" src="#" alt="Photo de profile">
        </article>
    </header>
    <main class="max-w-6xl mx-auto p-3 grid grid-cols-1 gap-4 items-start">
        <section class="info grid grid-cols-3 gap-1 text-lg text-center bg-sky-200 border border-purple-500 rounded-lg shadow-2xl">
            <p class="col-span-3 bg-[#3DC2FF] rounded-t-lg px-4 py-3 text-start font-bold">Information générales</p>
            <div class=" p-1 m-2 bg-sky-300 border border-sky-950 rounded-lg">
                <p class="text-sm">Prix total</p>
                <p class="font-bold">11 520 DH</p>
            </div>
            <div class="p-1 m-2 bg-sky-300 border border-sky-950 rounded-lg">
                <p class="text-sm">Places disponible</p>
                <p class="font-bold">180</p>
            </div>
            <div class="p-1 m-2 bg-sky-300 border border-sky-950 rounded-lg">
                <p class="text-sm">Places totales</p>
                <p class="font-bold">400</p>
            </div>
        </section>

    </main>
</body>
</html>
